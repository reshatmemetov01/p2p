<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Моя Ферма</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="title"><h1>🚜 МОЯ ФЕРМА</h1></div>
      <div class="coins-box">
        <span class="coin-ico">🪙</span>
        <span class="coins" id="coins">0</span>
      </div>
    </header>

    <div id="x2-banner" class="x2-banner hidden">⚡ x2 монеты: <span id="x2-time">60</span>с</div>

    <div id="field-wrap">
      <canvas id="field"></canvas>

      <!-- Джойстик (появляется под пальцем слева) -->
      <div id="joy" class="joy hidden"><div id="joy-knob" class="joy-knob"></div></div>

      <!-- Кнопка действия -->
      <button id="btn-action" class="action-btn">🌱</button>

      <!-- Собрать всё -->
      <button id="btn-harvest" class="harvest-btn">🧺 Всё</button>

      <!-- Подсказка над грядкой -->
      <div id="prompt" class="prompt hidden"></div>
    </div>

    <div class="shop" id="shop"></div>

    <div class="powerbar">
      <button class="power" id="pw-x2"><span class="pw-ico">💰</span><span class="pw-name">x2 на 60с</span></button>
      <button class="power" id="pw-water"><span class="pw-ico">⚡</span><span class="pw-name">Полить всё</span></button>
      <button class="power" id="pw-gift"><span class="pw-ico">🎁</span><span class="pw-name">Бонус</span></button>
    </div>

    <p class="hint" id="hint">Ходи джойстиком (или WASD) · подойди к грядке и нажми 🌱</p>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://yandex.ru/games/sdk/v2?v=2"></script>
  <script src="js/yandex-sdk.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
