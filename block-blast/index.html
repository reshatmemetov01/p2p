<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Блок Бласт</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="title">
        <h1>БЛОК БЛАСТ</h1>
      </div>
      <div class="scores">
        <div class="score-box">
          <div class="score-label">СЧЁТ</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">РЕКОРД</div>
          <div class="score-value" id="best">0</div>
        </div>
      </div>
    </header>

    <div id="combo" class="combo hidden"></div>

    <div id="board-wrap">
      <div id="board"></div>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <div class="overlay-emoji">💥</div>
          <div class="overlay-title">Поле забито!</div>
          <div class="overlay-sub" id="overlay-sub">Счёт: 0</div>
          <button class="btn btn-reward" id="btn-continue">
            <span class="reward-ico">▶</span> Продолжить за рекламу
          </button>
          <button class="btn btn-new" id="btn-restart">Начать заново</button>
        </div>
      </div>
    </div>

    <div id="tray" class="tray"></div>

    <div class="powerbar">
      <button class="power" id="pw-refresh">
        <span class="pw-ico">🔄</span><span class="pw-name">Новые фигуры</span>
      </button>
      <button class="power" id="pw-hammer">
        <span class="pw-ico">🔨</span><span class="pw-name">Молоток</span>
      </button>
    </div>

    <div class="toolbar">
      <button class="btn btn-new" id="btn-new">Новая игра</button>
    </div>

    <div id="hammer-hint" class="bomb-hint hidden">🔨 Нажми на блок, чтобы разбить</div>

    <p class="hint">Перетаскивай фигуры на поле · собирай ряды и столбцы</p>
  </div>

  <script src="https://yandex.ru/games/sdk/v2?v=2"></script>
  <script src="js/yandex-sdk.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
