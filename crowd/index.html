<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Crowd Rush</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <button class="sound-btn" id="sound-btn" title="Sound" data-i18n="sound" data-i18n-title>🔊</button>

    <div class="hud">
      <div class="progress">
        <div class="lvl" id="lvl">1</div>
        <div class="bar"><div class="fill" id="prog"></div></div>
        <div class="flag">🏁</div>
      </div>
    </div>
    <div class="coins-pill"><span id="coins">0</span><span class="coin-ico">$</span></div>
    <span id="crowd" class="hidden">10</span><span id="dist" class="hidden">0</span>

    <div class="tap-hint" id="tap-hint" data-i18n="hint">Drag left and right</div>

    <div id="start" class="screen">
      <div class="screen-card">
        <div class="big-emoji">🏃‍♂️</div>
        <h1 data-i18n="title">CROWD RUSH</h1>
        <p data-i18n="intro">Lead your crowd with your finger. Pick the best gates, avoid pits, beat the red crowds and reach the finish stairs!</p>
        <button class="btn btn-main" id="btn-start" disabled data-i18n="loading">Loading…</button>
      </div>
    </div>

    <div id="end" class="screen hidden">
      <div class="screen-card">
        <div class="big-emoji">💀</div>
        <h1></h1>
        <div class="stats">
          <b id="end-coins">0</b>
        </div>
        <button class="btn btn-reward" id="btn-revive"><span class="reward-ico">▶</span> <span data-i18n="revive">Continue (watch ad)</span></button>
        <button class="btn btn-reward" id="btn-x2"><span class="reward-ico">▶</span> <span data-i18n="x2">Double coins</span></button>
        <button class="btn btn-main" id="btn-upgrades" data-i18n="upgrades">🔧 Upgrades</button>
        <button class="btn btn-ghost" id="btn-again">Retry</button>
      </div>
    </div>

    <div id="shop" class="screen hidden">
      <div class="screen-card wide">
        <h1 data-i18n="shop">🔧 Upgrades</h1>
        <div class="balance">🪙 <span id="shop-coins">0</span></div>
        <div class="upg" id="upg-start"></div>
        <div class="upg" id="upg-income"></div>
        <button class="btn btn-main" id="btn-close-shop" data-i18n="done">Done</button>
      </div>
    </div>
  </div>

  <script src="js/three.min.js"></script>
  <script src="js/GLTFLoader.js"></script>
  <script src="js/SkeletonUtils.js"></script>
  <script src="js/bridge-sdk.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
